<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web00.ru — продажа сайтов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Глобальные стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d15;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #f0f4ff;
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
            overflow-x: hidden;
        }

        /* Шапка */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            background: rgba(11, 13, 21, 0.85);
            backdrop-filter: blur(16px);
            z-index: 100;
            width: 100%;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .logo:hover {
            transform: scale(1.02);
        }

        .nav-links {
            display: flex;
            gap: 12px 32px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-links button {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            padding: 6px 0;
            font-family: inherit;
            white-space: nowrap;
        }

        .nav-links button::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #a78bfa, #6ee7b7);
            transition: 0.3s;
        }

        .nav-links button:hover {
            color: #fff;
        }
        .nav-links button:hover::after {
            width: 100%;
        }

        .nav-links button.active {
            color: #fff;
        }
        .nav-links button.active::after {
            width: 100%;
        }

        /* ===== УНИВЕРСАЛЬНЫЙ СТИЛЬ КНОПОК ===== */
        .btn-universal,
        .btn-universal-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: auto;
            min-width: 200px;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            text-align: center;
            border: none;
            line-height: 1.3;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-universal {
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            color: #0b0d15;
            box-shadow: 0 4px 20px rgba(167, 139, 250, 0.25);
        }

        .btn-universal:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 40px rgba(167, 139, 250, 0.45);
        }

        .btn-universal:active {
            transform: scale(0.96);
            transition-duration: 0.08s;
        }

        .btn-universal-outline {
            background: transparent;
            border: 1.5px solid rgba(167, 139, 250, 0.35);
            color: #f0f4ff;
        }

        .btn-universal-outline:hover {
            background: rgba(167, 139, 250, 0.12);
            border-color: #a78bfa;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(167, 139, 250, 0.2);
        }

        .btn-universal-outline:active {
            transform: scale(0.96);
        }

        /* Центрирование кнопок */
        .btn-center {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 16px 0;
            width: 100%;
        }

        .btn-group-equal {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 14px;
            width: 100%;
        }

        .btn-group-equal .btn-universal,
        .btn-group-equal .btn-universal-outline {
            flex: 1 1 auto;
            min-width: 180px;
            max-width: 280px;
            white-space: nowrap;
        }

        .nav-links .btn-universal,
        .nav-links .btn-universal-outline {
            min-width: 140px;
            padding: 10px 20px;
            font-size: 0.9rem;
        }

        #main-content {
            padding: 40px 0 60px;
            min-height: 60vh;
            animation: fadeSlide 0.4s ease;
            width: 100%;
            overflow-x: hidden;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .faq-page {
            width: 100%;
            overflow-x: hidden;
        }

        .faq-page h2 {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            word-break: break-word;
        }

        .faq-page .subhead {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 20px;
            word-break: break-word;
        }

        .faq-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px 40px;
        }

        .faq-block h3 {
            color: #a78bfa;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .faq-block h3 i {
            color: #6ee7b7;
            font-size: 0.9rem;
        }

        .faq-block ul {
            list-style: none;
            padding: 0;
        }

        .faq-block ul li {
            color: #cbd5e1;
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
            font-size: 0.98rem;
            word-break: break-word;
        }

        .faq-block ul li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: #6ee7b7;
        }

        .faq-block p {
            color: #cbd5e1;
            font-size: 0.98rem;
            padding-left: 20px;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .faq-highlight {
            background: rgba(167, 139, 250, 0.07);
            border-radius: 16px;
            padding: 18px 22px;
            margin-top: 10px;
            border-left: 3px solid #a78bfa;
        }

        .faq-highlight p {
            color: #e2e8f0;
            padding-left: 0;
        }

        .faq-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 14px 0 6px;
        }

        .faq-tags span {
            background: rgba(167, 139, 250, 0.1);
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.82rem;
            color: #cbd5e1;
            border: 1px solid rgba(167, 139, 250, 0.08);
            white-space: nowrap;
        }

        .faq-questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
            margin-top: 20px;
            width: 100%;
        }

        .faq-question-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
        }

        .faq-question-btn {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            width: 100%;
            min-height: 52px;
            height: auto;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            text-align: left;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            word-break: break-word;
            white-space: normal;
            line-height: 1.3;
            position: relative;
        }

        .faq-question-btn:hover {
            background: rgba(167, 139, 250, 0.12);
            border-color: rgba(167, 139, 250, 0.3);
            transform: translateY(-2px);
            color: #fff;
        }

        .faq-question-btn.active {
            background: rgba(167, 139, 250, 0.15);
            border-color: #a78bfa;
            color: #fff;
        }

        .faq-question-btn .fa-chevron-right {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .faq-question-btn .btn-text {
            padding-left: 24px;
            flex: 1;
        }

        .faq-answer {
            display: none;
            margin-top: 8px;
            padding: 16px 20px;
            background: rgba(167, 139, 250, 0.06);
            border-radius: 16px;
            border-left: 3px solid #6ee7b7;
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.6;
            width: 100%;
            animation: fadeSlide 0.3s ease;
            word-break: break-word;
        }

        .faq-answer.show {
            display: block;
        }

        .faq-answer strong {
            color: #a78bfa;
        }

        .faq-cta-block {
            margin-top: 40px;
            padding: 32px 28px;
            background: rgba(167, 139, 250, 0.06);
            border-radius: 24px;
            border: 1px solid rgba(167, 139, 250, 0.12);
            text-align: center;
            width: 100%;
        }

        .faq-cta-block h3 {
            color: #f0f4ff;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .faq-cta-block p {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .page-template {
            width: 100%;
            overflow-x: hidden;
        }

        .page-template h2 {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            word-break: break-word;
        }

        .page-template .page-desc {
            color: #94a3b8;
            font-size: 1.15rem;
            max-width: 700px;
            margin-bottom: 32px;
            word-break: break-word;
        }

        .page-template .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }

        .page-template .mini-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 24px;
            transition: 0.3s;
        }

        .page-template .mini-card:hover {
            border-color: rgba(167, 139, 250, 0.25);
            transform: translateY(-6px);
        }

        .page-template .mini-card h4 {
            font-size: 1.2rem;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .page-template .mini-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .page-template .mini-card .meta {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 32px;
            margin: 60px 0;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 36px 24px;
            transition: 0.4s;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-12px);
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .card i {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            display: inline-block;
        }

        .card h3 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .card p {
            color: #94a3b8;
            margin-bottom: 16px;
            word-break: break-word;
            flex: 1;
        }

        .card .price {
            font-size: 2rem;
            font-weight: 700;
            color: #f0f4ff;
            margin-bottom: 16px;
        }
        .card .price small {
            font-size: 0.9rem;
            color: #64748b;
        }

        .card .btn-center {
            width: 100%;
            margin-top: auto;
        }

        .card .btn-center .btn-universal {
            min-width: 180px;
            width: 100%;
            max-width: 220px;
        }

        .footer {
            padding: 32px 0 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 20px;
            width: 100%;
        }

        .footer .social a {
            color: #94a3b8;
            margin-left: 20px;
            font-size: 1.3rem;
            transition: 0.3s;
        }
        .footer .social a:hover {
            color: #a78bfa;
        }

        /* ===== МОДАЛЬНОЕ ОКНО (ФОРМА) ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
            z-index: 999;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: #141824;
            max-width: 480px;
            width: 100%;
            border-radius: 32px;
            padding: 36px 32px 32px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            transform: translateY(30px) scale(0.95);
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(167, 139, 250, 0.15);
            position: relative;
        }

        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f0f4ff;
        }

        .modal-header h2 i {
            color: #a78bfa;
            margin-right: 8px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
            padding: 0 4px;
        }

        .modal-close:hover {
            color: #f0f4ff;
            transform: rotate(90deg);
        }

        .modal-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #a78bfa;
            padding: 10px 0 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 18px;
        }

        .modal-price small {
            font-size: 1rem;
            font-weight: 400;
            color: #94a3b8;
        }

        .service-list {
            list-style: none;
            margin: 16px 0 24px;
            padding: 0;
            text-align: left;
        }

        .service-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .service-list li:last-child {
            border-bottom: none;
        }

        .service-list li i {
            color: #6ee7b7;
            font-size: 0.9rem;
            width: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #f0f4ff;
            font-size: 1rem;
            font-family: inherit;
            transition: 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #a78bfa;
            background: rgba(167, 139, 250, 0.08);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .modal .btn-universal {
            width: 100%;
            min-width: unset;
            padding: 16px;
            font-size: 1.05rem;
            margin-top: 8px;
        }

        /* ===== УВЕДОМЛЕНИЕ-СЕРДЕЧКО ===== */
        .heart-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #141824;
            padding: 48px 40px 40px;
            border-radius: 32px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
            z-index: 1000;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 400px;
            width: 90%;
        }

        .heart-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .heart-notification .heart-icon {
            font-size: 4rem;
            color: #ff6b8a;
            animation: heartBeat 0.8s ease infinite alternate;
            display: block;
            margin-bottom: 16px;
        }

        @keyframes heartBeat {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.15);
            }
        }

        .heart-notification h3 {
            color: #f0f4ff;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .heart-notification p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .heart-notification .btn-universal {
            margin-top: 20px;
            min-width: 140px;
            padding: 12px 32px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }
            .navbar {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
                padding: 16px 0;
            }
            .nav-links {
                justify-content: center;
                gap: 12px 16px;
            }
            .nav-links button {
                font-size: 0.85rem;
                white-space: nowrap;
            }
            .btn-universal,
            .btn-universal-outline {
                min-width: 140px;
                padding: 10px 18px;
                font-size: 0.85rem;
                white-space: nowrap;
            }
            .faq-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .faq-questions-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .faq-question-btn {
                min-height: 48px;
                padding: 10px 16px;
                font-size: 0.85rem;
            }
            .faq-question-btn .fa-chevron-right {
                left: 12px;
                font-size: 0.8rem;
            }
            .faq-question-btn .btn-text {
                padding-left: 20px;
            }
            .faq-cta-block {
                padding: 24px 18px;
            }
            .faq-cta-block h3 {
                font-size: 1.2rem;
            }
            .page-template .card-grid {
                grid-template-columns: 1fr;
            }
            .grid-3 {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .faq-tags span {
                font-size: 0.75rem;
                padding: 4px 14px;
            }
            .btn-group-equal .btn-universal,
            .btn-group-equal .btn-universal-outline {
                min-width: 160px;
                max-width: 260px;
                white-space: nowrap;
            }
            .card .btn-center .btn-universal {
                min-width: 160px;
                max-width: 200px;
            }
            .modal {
                padding: 28px 20px 24px;
            }
            .modal-header h2 {
                font-size: 1.3rem;
            }
            .modal-price {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 12px;
            }
            .nav-links {
                gap: 8px 10px;
            }
            .nav-links button {
                font-size: 0.75rem;
                padding: 4px 6px;
                white-space: nowrap;
            }
            .btn-universal,
            .btn-universal-outline {
                min-width: 120px;
                padding: 8px 14px;
                font-size: 0.8rem;
                white-space: nowrap;
            }
            .faq-question-btn {
                min-height: 44px;
                padding: 8px 12px;
                font-size: 0.78rem;
            }
            .faq-question-btn .fa-chevron-right {
                left: 10px;
                font-size: 0.7rem;
            }
            .faq-question-btn .btn-text {
                padding-left: 16px;
            }
            .faq-cta-block {

<script>
    // ===== АДРЕС ВАШЕГО БЭКЕНДА =====
    const API_BASE = 'http://185.135.80.119:3000/api';

    // ===== ЗАГРУЗКА ТАРИФОВ =====
    async function loadTariffs() {
        try {
            const res = await fetch(API_BASE + '/tariffs');
            if (!res.ok) throw new Error('Ошибка загрузки тарифов');
            const tariffs = await res.json();
            
            const grid = document.querySelector('.grid-3');
            if (!grid) return;
            
            if (tariffs.length === 0) {
                grid.innerHTML = '<p style="color: #94a3b8; text-align: center; width: 100%;">Нет тарифов. Добавьте их в админке.</p>';
                return;
            }

            grid.innerHTML = tariffs.map(t => `
                <div class="card">
                    <i class="fas fa-infinity"></i>
                    <h3>${t.name}</h3>
                    <p>${t.description || 'Полный цикл разработки'}</p>
                    <div class="price">от ${t.price} р<small>/ сайт</small></div>
                    <div class="btn-center">
                        <button class="btn-universal" onclick="openModal('${t.name}')">
                            <i class="fas fa-shopping-cart"></i> Подробнее
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Обновляем данные для модальных окон
            window.tariffData = {};
            tariffs.forEach(t => {
                window.tariffData[t.name] = {
                    price: t.price,
                    services: t.services || []
                };
            });
        } catch (err) {
            console.error('Ошибка загрузки тарифов:', err);
            const grid = document.querySelector('.grid-3');
            if (grid) grid.innerHTML = '<p style="color: #ff6b6b; text-align: center; width: 100%;">Не удалось загрузить тарифы. Проверьте подключение к бэкенду.</p>';
        }
    }

    // ===== ЗАГРУЗКА КАРТОЧЕК =====
    async function loadCardsForPage(page) {
        try {
            const res = await fetch(API_BASE + '/cards');
            if (!res.ok) throw new Error('Ошибка загрузки карточек');
            const cards = await res.json();
            
            const type = page === 'portfolio' ? 'portfolio' : 'blog';
            const filtered = cards.filter(c => c.type === type);
            
            const container = document.querySelector('#main-content .card-grid');
            if (!container) return;
            
            if (filtered.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; text-align: center; width: 100%;">Нет карточек. Добавьте их в админке.</p>';
                return;
            }

            container.innerHTML = filtered.map(c => `
                <div class="mini-card">
                    <h4>${c.title}</h4>
                    <p>${c.description || ''}</p>
                    <div class="meta">${c.meta || ''}</div>
                </div>
            `).join('');
        } catch (err) {
            console.error('Ошибка загрузки карточек:', err);
            const container = document.querySelector('#main-content .card-grid');
            if (container) container.innerHTML = '<p style="color: #ff6b6b; text-align: center; width: 100%;">Не удалось загрузить карточки. Проверьте подключение к бэкенду.</p>';
        }
    }

    // ===== ПЕРЕОПРЕДЕЛЯЕМ loadPage =====
    const originalLoadPage = loadPage;
    loadPage = function(page) {
        originalLoadPage(page);
        
        // После вставки HTML загружаем данные
        if (page === 'home') {
            loadTariffs();
        } else if (page === 'portfolio' || page === 'blog') {
            loadCardsForPage(page);
        }
    };

    // ===== ПРИ ПЕРВОЙ ЗАГРУЗКЕ СТРАНИЦЫ =====
    document.addEventListener('DOMContentLoaded', () => {
        // Вызываем оригинальную loadPage('home') уже есть, но мы переопределили её,
        // поэтому она сама подгрузит данные.
        // Но если страница уже загружена, инициализируем загрузку данных.
        if (document.querySelector('.grid-3')) {
            loadTariffs();
        }
    });
</script>

</body>
</html>
