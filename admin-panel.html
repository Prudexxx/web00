            </div>

<script>
// ============================================
// КОНФИГУРАЦИЯ
// ============================================
const API_BASE = 'https://enhancements-decreased-spelling-satisfaction.trycloudflare.com/api';
let token = localStorage.getItem('token');

// ============================================
// ФУНКЦИИ ВХОДА/ВЫХОДА
// ============================================
async function login() {
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;
    const notification = document.getElementById('loginNotification');
    
    try {
        const response = await fetch(`${API_BASE}/tariffs/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            token = data.token;
            localStorage.setItem('token', token);
            showNotification('✅ Вход выполнен успешно!', 'success');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            loadData();
        } else {
            notification.className = 'notification error';
            notification.textContent = '❌ ' + (data.error || 'Неверный логин или пароль');
        }
    } catch (error) {
        notification.className = 'notification error';
        notification.textContent = '❌ Ошибка соединения с сервером';
    }
}

function logout() {
    localStorage.removeItem('token');
    token = null;
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
}

// ============================================
// ЗАГРУЗКА ДАННЫХ
// ============================================
async function loadData() {
    await loadTariffs();
    await loadCards('blog');
    await loadCards('portfolio');
}

async function loadTariffs() {
    try {
        const response = await fetch(`${API_BASE}/tariffs`);
        const tariffs = await response.json();
        
        const container = document.getElementById('tariffsList');
        if (tariffs.length === 0) {
            container.innerHTML = '<p style="color: #94a3b8;">Тарифов пока нет. Добавьте первый!</p>';
            return;
        }
        
        container.innerHTML = tariffs.map(t => `
            <div class="admin-card">
                <h4>${t.name}</h4>
                <p style="color: #6ee7b7; font-size: 20px; font-weight: 700;">${t.price} ₽</p>
                <p style="color: #94a3b8; font-size: 14px;">${t.description || ''}</p>
                <div style="margin: 8px 0;">
                    ${t.services.map(s => `<span class="service-tag">${s}</span>`).join('')}
                </div>
                <div class="meta">Создан: ${new Date(t.createdAt).toLocaleDateString()}</div>
                <div class="actions">
                    <button class="btn-edit" onclick="editTariff('${t._id}')">
                        <i class="fas fa-edit"></i> Редактировать
                    </button>
                    <button class="btn-delete" onclick="deleteTariff('${t._id}')">
                        <i class="fas fa-trash"></i> Удалить
                    </button>
                </div>
            </div>
        `).join('');
    } catch (error) {
        console.error('Ошибка загрузки тарифов:', error);
        document.getElementById('tariffsList').innerHTML = '<p style="color: #ff6b6b;">Ошибка загрузки тарифов</p>';
    }
}

async function loadCards(type) {
    try {
        const response = await fetch(`${API_BASE}/cards?type=${type}`);
        const cards = await response.json();
        
        const containerId = type === 'blog' ? 'blogList' : 'portfolioList';
        const container = document.getElementById(containerId);
        
        if (cards.length === 0) {
            container.innerHTML = '<p style="color: #94a3b8;">Записей пока нет. Добавьте первую!</p>';
            return;
        }
        
        container.innerHTML = cards.map(c => `
            <div class="admin-card">
                <h4>${c.title}</h4>
                <p style="color: #94a3b8; font-size: 14px;">${c.description || ''}</p>
                <div class="meta">${c.meta || ''}</div>
                <div class="actions">
                    <button class="btn-edit" onclick="editCard('${c._id}')">
                        <i class="fas fa-edit"></i> Редактировать
                    </button>
                    <button class="btn-delete" onclick="deleteCard('${c._id}')">
                        <i class="fas fa-trash"></i> Удалить
                    </button>
                </div>
            </div>
        `).join('');
    } catch (error) {
        console.error('Ошибка загрузки карточек:', error);
        document.getElementById(containerId).innerHTML = '<p style="color: #ff6b6b;">Ошибка загрузки</p>';
    }
}

// ============================================
// ВКЛАДКИ
// ============================================
function switchTab(tab) {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelector(`.tabs button[data-tab="${tab}"]`).classList.add('active');
    
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
}

// ============================================
// МОДАЛЬНОЕ ОКНО
// ============================================
function openModal(type, cardType = null) {
    document.getElementById('modal').classList.add('active');
    document.getElementById('editId').value = '';
    document.getElementById('editType').value = '';
    
    if (type === 'tariff') {
        document.getElementById('modalTitle').textContent = 'Добавить тариф';
        document.getElementById('tariffFields').style.display = 'block';
        document.getElementById('cardFields').style.display = 'none';
        document.getElementById('tariffName').value = '';
        document.getElementById('tariffPrice').value = '';
        document.getElementById('tariffDescription').value = '';
        document.getElementById('tariffServices').value = '';
        document.getElementById('tariffOrder').value = '0';
        document.getElementById('editType').value = 'tariff';
    } else {
        document.getElementById('modalTitle').textContent = cardType === 'blog' ? 'Добавить статью' : 'Добавить проект';
        document.getElementById('tariffFields').style.display = 'none';
        document.getElementById('cardFields').style.display = 'block';
        document.getElementById('cardTitle').value = '';
        document.getElementById('cardDescription').value = '';
        document.getElementById('cardMeta').value = '';
        document.getElementById('cardOrder').value = '0';
        document.getElementById('editType').value = 'card';
        document.getElementById('editType').dataset.cardType = cardType;
    }
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

async function editTariff(id) {
    try {
        const response = await fetch(`${API_BASE}/tariffs/${id}`);
        const tariff = await response.json();
        
        document.getElementById('modal').classList.add('active');
        document.getElementById('editId').value = id;
        document.getElementById('editType').value = 'tariff';
        document.getElementById('modalTitle').textContent = 'Редактировать тариф';
        document.getElementById('tariffFields').style.display = 'block';
        document.getElementById('cardFields').style.display = 'none';
        
        document.getElementById('tariffName').value = tariff.name;
        document.getElementById('tariffPrice').value = tariff.price;
        document.getElementById('tariffDescription').value = tariff.description || '';
        document.getElementById('tariffServices').value = tariff.services.join('\n');
        document.getElementById('tariffOrder').value = tariff.order || 0;
    } catch (error) {
        showNotification('Ошибка загрузки тарифа', 'error');
    }
}

async function editCard(id) {
    try {
        const response = await fetch(`${API_BASE}/cards/${id}`);
        const card = await response.json();
        
        document.getElementById('modal').classList.add('active');
        document.getElementById('editId').value = id;
        document.getElementById('editType').value = 'card';
        document.getElementById('editType').dataset.cardType = card.type;
        document.getElementById('modalTitle').textContent = card.type === 'blog' ? 'Редактировать статью' : 'Редактировать проект';
        document.getElementById('tariffFields').style.display = 'none';
        document.getElementById('cardFields').style.display = 'block';
        
        document.getElementById('cardTitle').value = card.title;
        document.getElementById('cardDescription').value = card.description || '';
        document.getElementById('cardMeta').value = card.meta || '';
        document.getElementById('cardOrder').value = card.order || 0;
    } catch (error) {
        showNotification('Ошибка загрузки карточки', 'error');
    }
}

// ============================================
// СОХРАНЕНИЕ ФОРМЫ
// ============================================
async function saveForm() {
    console.log('✅ saveForm() вызвана!');
    
    const editId = document.getElementById('editId').value;
    const type = document.getElementById('editType').value;
    const token = localStorage.getItem('token');
    
    console.log('editId:', editId);
    console.log('type:', type);
    console.log('token:', token ? 'есть' : 'нет');
    
    if (!token) {
        showNotification('❌ Требуется авторизация. Войдите заново.', 'error');
        return;
    }
    
    let url, method, data;
    
    if (type === 'tariff') {
        const services = document.getElementById('tariffServices').value
            .split('\n')
            .filter(s => s.trim());
        
        data = {
            name: document.getElementById('tariffName').value,
            price: document.getElementById('tariffPrice').value,
            description: document.getElementById('tariffDescription').value,
            services: services,
            order: parseInt(document.getElementById('tariffOrder').value) || 0
        };
        
        url = `${API_BASE}/tariffs`;
        method = editId ? 'PUT' : 'POST';
        if (editId) url += `/${editId}`;
    } else {
        const cardType = document.getElementById('editType').dataset.cardType;
        data = {
            type: cardType,
            title: document.getElementById('cardTitle').value,
            description: document.getElementById('cardDescription').value,
            meta: document.getElementById('cardMeta').value,
            order: parseInt(document.getElementById('cardOrder').value) || 0
        };
        
        url = `${API_BASE}/cards`;
        method = editId ? 'PUT' : 'POST';
        if (editId) url += `/${editId}`;
    }
    
    console.log('📤 Отправка:', { url, method, data });
    
    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(data)
        });
        
        console.log('📥 Ответ статус:', response.status);
        
        if (response.ok) {
            const result = await response.json();
            console.log('✅ Успешно сохранено:', result);
            closeModal();
            showNotification('✅ Сохранено успешно!', 'success');
            loadData();
        } else {
            const error = await response.json();
            console.error('❌ Ошибка:', error);
            showNotification('❌ Ошибка: ' + (error.error || 'Неизвестная ошибка'), 'error');
        }
    } catch (error) {
        console.error('❌ Ошибка соединения:', error);
        showNotification('❌ Ошибка соединения с сервером', 'error');
    }
}

// ============================================
// УДАЛЕНИЕ
// ============================================
async function deleteTariff(id) {
    if (!confirm('Удалить тариф?')) return;
    
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/tariffs/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
            showNotification('✅ Тариф удалён', 'success');
            loadTariffs();
        } else {
            showNotification('❌ Ошибка удаления', 'error');
        }
    } catch (error) {
        showNotification('❌ Ошибка удаления', 'error');
    }
}

async function deleteCard(id) {
    if (!confirm('Удалить запись?')) return;
    
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/cards/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
            showNotification('✅ Запись удалена', 'success');
            loadData();
        } else {
            showNotification('❌ Ошибка удаления', 'error');
        }
    } catch (error) {
        showNotification('❌ Ошибка удаления', 'error');
    }
}

// ============================================
// УВЕДОМЛЕНИЯ
// ============================================
function showNotification(message, type = 'success') {
    const notification = document.getElementById('notification');
    notification.className = `notification ${type}`;
    notification.textContent = (type === 'success' ? '✅ ' : '❌ ') + message;
    
    setTimeout(() => {
        notification.className = 'notification';
    }, 5000);
}
